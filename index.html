<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONEEB GLOBAL | Trade, Education & Services</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #162035;
      --card-border: #263554;
      --gold: #f59e0b;
      --gold-hover: #d97706;
      --green: #10b981;
      --blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* Header & Top Controls */
    header {
      background: linear-gradient(180deg, #0f172a 0%, #0b1120 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-bar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span.gold { color: var(--gold); }
    .brand span.green { color: var(--green); }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 11px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      transition: 0.2s;
    }

    .lang-btn.active {
      background: var(--gold);
      color: #000;
    }

    .user-badge {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Hero Banner */
    .hero {
      max-width: 1100px;
      margin: 24px auto 16px;
      padding: 0 20px;
      text-align: center;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Main Portal Tabs */
    .portal-tabs {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (max-width: 650px) {
      .portal-tabs {
        grid-template-columns: 1fr;
      }
    }

    .tab-btn {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      border-color: var(--gold);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(16, 185, 129, 0.15));
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
    }

    /* Dynamic Customer Form */
    .form-section {
      max-width: 1100px;
      margin: 0 auto 28px;
      padding: 0 20px;
    }

    .form-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
    }

    .form-title {
      font-size: 1.05rem;
      color: var(--gold);
      margin-bottom: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* Cards Grid */
    .catalog-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
    }

    .card-img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      background: #0f172a;
    }

    .card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-badge {
      align-self: flex-start;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .card-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      flex: 1;
    }

    .card-footer {
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .price-tag {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gold);
    }

    .btn-pi {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-pi:hover {
      background: var(--gold-hover);
    }

    /* Footer */
    footer {
      max-width: 1100px;
      margin: 40px auto 0;
      padding: 20px;
      border-top: 1px
